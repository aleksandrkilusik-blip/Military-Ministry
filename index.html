                                onClick={() => setActiveActivityTab('podcast')} 
                                className={`px-8 py-3 rounded-full font-bold text-lg transition-all ${activeActivityTab === 'podcast' ? 'bg-[#FFCA28] text-slate-900 shadow-md' : 'bg-white text-gray-500 border border-gray-200 hover:border-[#FFCA28]'}`}
                            >
                                Подкаст
                            </button>
                            <button 
                                onClick={() => setActiveActivityTab('retreats')} 
                                className={`px-8 py-3 rounded-full font-bold text-lg transition-all ${activeActivityTab === 'retreats' ? 'bg-[#FFCA28] text-slate-900 shadow-md' : 'bg-white text-gray-500 border border-gray-200 hover:border-[#FFCA28]'}`}
                            >
                                Ретрит
                            </button>
                        </div>

                        <div className="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 p-8 sm:p-12 min-h-[450px]">
                            {activeActivityTab === 'hospitals' && (
                                <div className="flex flex-col lg:flex-row gap-12 items-center">
                                    <div className="lg:w-1/2">
                                        <h3 className="text-3xl font-bold text-slate-900 mb-6">Турбота в госпіталях</h3>
                                        <p className="text-xl text-gray-600 leading-relaxed font-medium">
                                            З командою відвідуємо хлопців в госпіталі, це дає можливість показати тим хто на шляху до відновлення що надія є і далі тільки рух та життя, це простір де ми маємо гарне спілкування та підтримку.
                                        </p>
                                    </div>
                                    <div className="lg:w-1/2 w-full">
                                        <img src="https://raw.githubusercontent.com/aleksandrkilusik-blip/Military-Ministry/main/5ED39F71-2AED-47D8-98A6-AE03BF842819_1_105_c.jpeg" className="rounded-[2rem] w-full object-cover h-[350px] shadow-lg" alt="Госпіталі" />
                                    </div>
                                </div>
                            )}

                            {activeActivityTab === 'podcast' && (
                                <div className="flex flex-col lg:flex-row gap-12 items-center">
                                    <div className="lg:w-1/2">
                                        <h3 className="text-3xl font-bold text-slate-900 mb-6">Подкаст "Без броні"</h3>
                                        <p className="text-xl text-gray-600 leading-relaxed font-medium mb-8">
                                            Відкриті розмови про віру та війну для тисяч воїнів у партнерстві з Українською Баптистською Теологічною Семінарією (УБТС).
                                        </p>
                                        <div className="flex flex-wrap gap-4">
                                            <a href="https://youtube.com/playlist?list=PLF7PYvFUKJXKWFEcvs6UVisVNEZm91Sbm&si=VL_tu0xny7Ax20jd" target="_blank" rel="noopener noreferrer" className="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl flex items-center transition-colors">
                                                <svg className="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                                                Дивитись всі епізоди
                                            </a>
                                            <button className="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-6 rounded-xl flex items-center transition-colors">
                                                <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                Свіжий випуск
                                            </button>
                                        </div>
                                    </div>
                                    <div className="lg:w-1/2 w-full">
                                        <img src="https://raw.githubusercontent.com/aleksandrkilusik-blip/Military-Ministry/main/IMG_6519.jpeg" className="rounded-[2rem] w-full object-cover h-[350px] shadow-lg" alt="Подкаст Без броні" />
                                    </div>
                                </div>
                            )}

                            {activeActivityTab === 'retreats' && (
                                <div className="flex flex-col lg:flex-row gap-12">
                                    <div className="lg:w-1/2">
                                        <h3 className="text-3xl font-bold text-slate-900 mb-6 uppercase tracking-tight">РЕТРИТИ: БЕЗПЕЧНИЙ ПРОСТІР</h3>
                                        <p className="text-xl text-gray-600 leading-relaxed font-medium mb-8">
                                            Це «коло своїх», де ветерани можуть по-справжньому розслабитися. Я роблю це, щоб дати можливість відпочити від рутини та сірої буденності, перебуваючи в колі побратимів, які розуміють тебе без зайвих слів.
                                        </p>
                                        <ul className="space-y-4">
                                            <li className="flex items-center text-lg font-medium text-slate-800">
                                                <span className="text-2xl mr-3">⛰️</span> Психологічне розвантаження у горах
                                            </li>
                                            <li className="flex items-center text-lg font-medium text-slate-800">
                                                <span className="text-[#FFCA28] text-2xl mr-3">💛</span> Духовне відновлення та спільна молитва
                                            </li>
                                        </ul>
                                    </div>
                                    <div className="lg:w-1/2 w-full grid grid-cols-2 gap-4">
                                        <img src="https://raw.githubusercontent.com/aleksandrkilusik-blip/Military-Ministry/main/retrit1.jpeg" className="col-span-2 rounded-[2rem] w-full object-cover h-[240px] shadow-lg" alt="Ретрит гори" />
                                        <img src="https://raw.githubusercontent.com/aleksandrkilusik-blip/Military-Ministry/main/retrit.jpeg" className="rounded-[2rem] w-full object-cover h-[200px] shadow-lg" alt="Ретрит екскурсія" />
                                        <img src="https://raw.githubusercontent.com/aleksandrkilusik-blip/Military-Ministry/main/retrit3.jpeg" className="rounded-[2rem] w-full object-cover h-[200px] shadow-lg" alt="Ретрит спілкування" />
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                  </section>

                  <section id="team-section" className="pt-20 pb-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
                    <div className="text-center mb-16">
                      <h2 className="text-3xl sm:text-4xl font-bold text-slate-900 mb-4">Наша команда</h2>
                      <div className="w-24 h-1 bg-[#FFCA28] mx-auto rounded-full"></div>
                      <p className="mt-4 text-gray-600 max-w-2xl mx-auto text-lg">
                        Люди, які присвятили своє життя служінню військовим та їхнім родинам.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 sm:gap-10">
                      {teamMembers.map((member, index) => (
                        <div 
                          key={member.id} 
                          onClick={() => navigateToMember(member)}
                          className={`bg-white rounded-2xl shadow-md overflow-hidden cursor-pointer transform transition duration-300 hover:-translate-y-2 hover:shadow-xl group flex flex-col justify-between
                            ${index === 3 ? 'lg:col-start-1 lg:ml-[16.66%]' : ''} 
                            ${index === 4 ? 'lg:col-start-2' : ''}`}
                        >
                          <div>
                            <div className="h-72 w-full overflow-hidden bg-gray-200">
                              <img 
                                src={member.image} 
                                alt={member.name} 
                                className={`w-full h-full object-cover transition duration-700 group-hover:scale-105 ${member.objectPosition || 'object-center'}`}
                                loading="lazy"
                              />
                            </div>
                            <div className="pt-6 px-6 text-center">
                              <h3 className="text-xl font-bold text-slate-900 mb-1 group-hover:text-blue-600 transition">{member.name}</h3>
                              {member.role ? (
                                <p className="text-[#FFCA28] font-semibold text-sm mb-1">{member.role}</p>
                              ) : (
                                <div className="h-5"></div>
                              )}
                            </div>
                          </div>
                          
                          <div className="pb-6 px-6 text-center mt-3">
                            <span className="inline-flex items-center text-blue-600 font-bold text-sm tracking-wide group-hover:text-blue-700 transition">
                              {member.moreText}
                              <svg className="ml-1 w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7"></path>
                              </svg>
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                </main>
              ) : (
                <main className="max-w-4xl mx-auto px-4 py-12">
                  <button 
                    onClick={navigateToHome}
                    className="flex items-center text-gray-600 hover:text-blue-600 transition mb-8 font-medium"
                  >
                    <ArrowLeftIcon className="mr-2" />
                    Повернутися на головну
                  </button>
                  
                  <div className="bg-white rounded-3xl shadow-xl overflow-hidden">
                    <div className="h-[28rem] sm:h-[38rem] w-full relative">
                      <img 
                        src={selectedMember.image} 
                        alt={selectedMember.name} 
                        className={`w-full h-full object-cover ${selectedMember.objectPosition || 'object-center'}`}
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
                      <div className="absolute bottom-0 left-0 p-8 text-white">
                        <h1 className="text-4xl font-bold mb-2">{selectedMember.name}</h1>
                        <p className="text-xl text-[#FFCA28] font-medium">{selectedMember.role}</p>
                      </div>
                    </div>
                    <div className="p-8 sm:p-12">
                      <h2 className="text-2xl font-bold text-slate-900 mb-4">Про служіння</h2>
                      
                      {/* Робимо гарне відображення тексту з абзацами */}
                      <div className="text-gray-600 text-lg leading-relaxed mb-8 space-y-6">
                        {selectedMember.description.split('\n\n').map((paragraph, index) => (
                          <p key={index}>{paragraph}</p>
                        ))}
                      </div>

                      {/* Кнопка "Детальніше про мою діяльність" для членів команди, які мають зовнішнє посилання */}
                      {selectedMember.externalLink && (
                        <div className="mb-8">
                          <a 
                            href={selectedMember.externalLink} 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="inline-flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300 shadow-md text-base"
                          >
                            Детальніше про мою діяльність
                            <svg className="ml-2 w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                            </svg>
                          </a>
                        </div>
                      )}
                      
                      <div className="bg-slate-50 border border-gray-100 rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center">
                        <div className="mb-4 sm:mb-0">
                          <h3 className="font-bold text-slate-900">Бажаєте підтримати це служіння?</h3>
                          <p className="text-gray-500 text-sm">Ваша допомога є дуже важливою.</p>
                        </div>
                        <button className="bg-[#FFCA28] hover:bg-yellow-500 text-slate-900 font-bold py-3 px-8 rounded-xl transition w-full sm:w-auto">
                          Підтримати {selectedMember.name.split(' ')[0] === 'Сім\'я' ? 'їх' : 'його'}
                        </button>
                      </div>
                    </div>
                  </div>
                </main>
              )}

              <footer className="bg-slate-900 text-gray-400 py-12 text-center">
                <p>© 2026 Military Ministry Ukraine. Всі права захищено.</p>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
